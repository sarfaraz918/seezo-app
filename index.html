<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SEEZO Platform</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Font: Inter (Lightweight & Clean) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- App Wrapper -->
  <div id="app-container" class="app-container">
    
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="user-chip">
        <div class="user-avatar" id="top-user-avatar">
          <!-- Fallback Vector Icon -->
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="user-info">
          <span class="user-name" id="top-user-name">Loading...</span>
          <span class="user-status-badge" id="top-user-status">SYNCING</span>
        </div>
      </div>
      <div class="connection-status" id="connection-indicator">
        <span class="status-dot online"></span>
      </div>
    </header>

    <!-- Main Content Dynamic View Container -->
    <main id="main-content" class="main-content">
      <!-- ডিফল্ট স্ক্রিন হিসেবে Home ড্যাশবোর্ড স্ক্রিন থাকবে -->
      <section id="view-home" class="view-screen active">
        <!-- প্রাথমিক প্লেসহোল্ডার যা পরবর্তী ধাপে রিয়েল ব্র্যান্ডিং এবং ড্যাশবোর্ড কার্ডে রূপান্তরিত হবে -->
        <div class="system-notice-card">
          <div class="notice-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          </div>
          <div class="notice-text">
            <h3>SEEZO Core Engine Initialized</h3>
            <p id="telegram-debug-info">Checking Telegram WebApp context...</p>
          </div>
        </div>
      </section>

      <!-- অন্যান্য স্ক্রিনের প্লেসহোল্ডার কনটেইনার -->
      <section id="view-tasks" class="view-screen"></section>
      <section id="view-wallet" class="view-screen"></section>
      <section id="view-leaderboard" class="view-screen"></section>
      <section id="view-profile" class="view-screen"></section>
    </main>

    <!-- Bottom Navigation Bar (No emojis, Pure SVG icons) -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-target="view-home">
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="nav-label">Home</span>
      </button>

      <button class="nav-item" data-target="view-tasks">
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 11 12 14 22 4"></polyline>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
        <span class="nav-label">Tasks</span>
      </button>

      <button class="nav-item" data-target="view-wallet">
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
          <line x1="1" y1="10" x2="23" y2="10"></line>
        </svg>
        <span class="nav-label">Wallet</span>
      </button>

      <button class="nav-item" data-target="view-leaderboard">
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 20V10"></path>
          <path d="M12 20V4"></path>
          <path d="M6 20v-6"></path>
        </svg>
        <span class="nav-label">Ranking</span>
      </button>

      <button class="nav-item" data-target="view-profile">
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="nav-label">Profile</span>
      </button>
    </nav>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
